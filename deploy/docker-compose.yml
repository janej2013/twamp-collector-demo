# Observability stack for the backpressure demo:
#   make stack-up   → Prometheus :9091 + Grafana :3300 (anonymous admin)
#   make stack-down → tear down
#
# Bridge network + published ports (not network_mode: host) on purpose:
# under WSL2 mirrored networking, listeners opened inside host-network
# containers are not mirrored to Windows, but docker-proxy's own
# listeners are — so localhost:3300/9091 work from the Windows browser.
# Prometheus reaches the collector on the host via host-gateway.
# Grafana publishes on 3300 because Windows winnat reserves 3000-3099
# on this machine (excluded port range; binds there fail system-wide).
services:
  prometheus:
    image: prom/prometheus:v3.0.1
    ports:
      - "9091:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana-oss:11.4.0
    ports:
      - "3300:3000"
    environment:
      # demo convenience: no login wall, 1s refresh allowed
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_DASHBOARDS_MIN_REFRESH_INTERVAL=1s
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/twamp.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
