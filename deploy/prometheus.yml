# Demo-grade scrape config: 1s interval so burst drops show up while you
# watch. Production would use 15s+ and remote_write.
global:
  scrape_interval: 1s
  scrape_timeout: 900ms

# host.docker.internal resolves to the WSL host (host-gateway mapping in
# docker-compose.yml); the collector must listen on a wildcard address.
scrape_configs:
  - job_name: twamp-collector
    static_configs:
      - targets: ["host.docker.internal:9090"]
